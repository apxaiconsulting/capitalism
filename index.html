<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0a0c10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Capitalism">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Capitalism - drill it, sell it, buy the government. A strategy game about the oil century.">
<title>Capitalism</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="css/main.css">
</head>
<body>

<div id="app" hidden>
  <div id="stage">
    <canvas id="scene"></canvas>

    <div class="topbar">
      <button class="pill" data-panel="menu">MENU</button>
      <button class="pill big" data-panel="actions">ACTIONS</button>
      <button class="pill" data-panel="stats">STATS</button>
    </div>

    <div id="ticker" class="ticker"></div>

    <button id="globe" class="globe" aria-label="World map">
      <span class="globe-face"></span>
      <small id="globe-label">TEXAS</small>
    </button>

    <div class="readout">
      <span class="r-item"><i>&#128176;</i><b id="r-cash">0</b></span>
      <span class="r-item"><i>&#128738;</i><b id="r-oil">0</b></span>
      <span class="r-item"><i>&#128167;</i><b id="r-add">0%</b></span>
      <span class="r-item"><i>&#9881;</i><b id="r-gdp">0%</b></span>
      <span class="r-year" id="r-year">1946</span>
      <button id="r-play" class="r-play" aria-label="Advance a year">&#9654;</button>
    </div>

    <div class="vgauge" id="vgauge" title="Production against demand">
      <div class="vg-track"><div class="vg-fill" id="vg-fill"></div><div class="vg-line" id="vg-line"></div></div>
      <small id="vg-note">0 / 0</small>
    </div>

    <div id="armed" class="armed" hidden></div>
  </div>

  <div id="panel" class="panel"><div class="panel-in" id="panel-in"></div></div>
  <div id="panel-scrim" class="panel-scrim"></div>
</div>

<div id="title-screen">
  <div class="title-art" aria-hidden="true">
    <div class="derrick"><i></i><i></i><i></i><i></i></div>
    <div class="gush"></div>
  </div>
  <h1>CAPITAL<span>ISM</span></h1>
  <p class="tagline">Drill it, sell it, buy the government.</p>
  <div id="title-menu"></div>
  <footer class="title-foot">
    <span>v<span id="v-num"></span></span> &middot;
    <button class="link" data-help="how">How to play</button> &middot;
    <button class="link" data-help="credits">Credits</button>
  </footer>
</div>

<div id="rotate">
  <div class="ph" aria-hidden="true"></div>
  <b>Turn your phone sideways</b>
  <small>Capitalism is played across a wide strip of ground, and there is a lot of it underneath.</small>
  <button class="btn sm ghost" id="rotate-skip">Play in portrait anyway</button>
</div>

<div id="modal-root"></div>
<div id="toasts"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
